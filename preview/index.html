<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sound to Species — Preview</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo">Sound to Species</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="species.html">Species</a>
        <a href="upload.html">Upload</a>
        <button id="login-toggle">Login</button>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Identify wild animals by sound</h1>
      <p>Record audio and get instant identification results (preview).</p>
      <a class="cta" href="upload.html">Record / Upload</a>
    </section>

    <section class="features">
      <h2>Popular Species</h2>
      <div class="cards">
        <article class="card">
          <h3>Common Loon</h3>
          <p>Gavia immer</p>
          <button>Play sample</button>
        </article>
        <article class="card">
          <h3>Barred Owl</h3>
          <p>Strix varia</p>
          <button>Play sample</button>
        </article>
        <article class="card">
          <h3>American Bullfrog</h3>
          <p>Lithobates catesbeianus</p>
          <button>Play sample</button>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© Sound to Species — Preview</div>
  </footer>

  <script src="assets/js/app.js"></script>
</body>
</html>
