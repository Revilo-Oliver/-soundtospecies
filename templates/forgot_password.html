<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forgot Password</title>
  <style>
    body{background:#0b0b0b;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{background:#0f0f0f;border:1px solid #222;padding:28px;border-radius:8px;max-width:480px;width:100%}
    input{width:100%;padding:10px;border-radius:6px;border:1px solid #333;background:#0b0b0b;color:#fff;margin-top:8px}
    .submit{background:#39ff14;color:#000;padding:10px 14px;border-radius:6px;border:none;font-weight:700;cursor:pointer;margin-top:12px}
    a{color:#9ad;text-decoration:none}
  </style>
</head>
<body>
  <div class="card">
    <h2>Forgot Password</h2>
    {% if message %}<p style="color:#9ad">{{ message }}</p>{% else %}
    <p>Enter your email and we'll send instructions to reset your password (if email is configured).</p>
    <form method="post" action="{% url 'forgot_password' %}">
      {% csrf_token %}
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <button class="submit" type="submit">Send reset instructions</button>
    </form>
    {% endif %}
    <p style="margin-top:12px;"><a href="{% url 'login' %}">Back to login</a></p>
  </div>
</body>
</html>
