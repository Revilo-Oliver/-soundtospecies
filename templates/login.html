<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Sound to Species</title>
  <style>
    body{background:#0b0b0b;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .card{background:#0f0f0f;border:1px solid #222;padding:28px;border-radius:8px;max-width:420px;width:100%}
    h2{margin:0 0 14px 0;color:#fff}
    label{display:block;color:#ccc;margin-bottom:6px;font-size:14px}
    input[type=text],input[type=password],input[type=email]{width:100%;padding:10px;border-radius:6px;border:1px solid #333;background:#0b0b0b;color:#fff;margin-bottom:12px}
    .pw-row{display:flex;gap:8px}
    .pw-row button{padding:8px 12px;border-radius:6px;background:#333;color:#fff;border:none;cursor:pointer}
    .submit{background:#39ff14;color:#000;padding:10px 14px;border-radius:6px;border:none;font-weight:700;cursor:pointer;width:100%}
    .meta{margin-top:10px;display:flex;justify-content:space-between;align-items:center}
    .meta a{color:#9ad; text-decoration:none}
    .error{color:#ff6b6b;margin-bottom:8px}
  </style>
</head>
<body>
  <div class="card">
    <h2>Log In</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <label for="username">Username or Email</label>
      <input type="text" id="username" name="username" required autocomplete="username">

      <label for="password">Password</label>
      <div class="pw-row">
        <input type="password" id="password" name="password" required autocomplete="current-password">
        <button type="button" id="togglePassword">Show</button>
      </div>

      <div style="margin-top:8px;">
        <button class="submit" type="submit">Log In</button>
      </div>

      <div class="meta">
        <span></span>
        <a href="{% url 'forgot_password' %}">Forgot password?</a>
      </div>
    </form>
  </div>

  <script>
    (function(){
      var toggle = document.getElementById('togglePassword');
      var pwd = document.getElementById('password');
      toggle && toggle.addEventListener('click', function(){
        if (pwd.type === 'password') { pwd.type = 'text'; toggle.textContent = 'Hide'; }
        else { pwd.type = 'password'; toggle.textContent = 'Show'; }
      });
    })();
  </script>
</body>
</html>
