<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound to Species - Discover Nature's Symphony</title>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-primary: #0c0c0c;
            --bg-secondary: #1a1a1a;
            --bg-card: rgba(26, 26, 26, 0.8);
            --text-primary: #f0f0f0;
            --text-secondary: #b0b0b0;
            --neon-cyan: #00ffff;
            --neon-pink: #ff00c8;
            --neon-green: #39ff14;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* --- THIS IS THE KEY FOR SMOOTH SCROLLING --- */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* --- Header & Navigation --- */
        header {
            background-color: rgba(12, 12, 12, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px var(--neon-cyan);
            text-decoration: none;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        /* --- This class is added by JavaScript to highlight the active section --- */
        .nav-links a:hover, .nav-links a.active-link {
            color: var(--neon-cyan);
        }

        /* --- Login Section in Header --- */
        .login-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #login-toggle-btn {
            background-color: var(--neon-pink);
            color: var(--bg-primary);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 0, 200, 0.5);
        }
        #login-toggle-btn:hover {
            box-shadow: 0 0 15px rgba(255, 0, 200, 0.8);
            transform: translateY(-2px);
        }

        #login-panel {
            display: none; /* Hidden by default */
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .login-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .login-form input {
            background-color: var(--bg-card);
            border: 1px solid var(--text-secondary);
            padding: 8px 12px;
            border-radius: 5px;
            color: var(--text-primary);
            font-size: 14px;
        }
        .login-form input:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }

        .login-form button {
            background-color: var(--neon-green);
            color: var(--bg-primary);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.5);
        }
        .login-form button:hover {
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.8);
            transform: translateY(-2px);
        }

        /* --- Hero Section --- */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1516466723363-793a9c15496e?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .hero-content h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
        }

        .hero-content p {
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 30px auto;
            color: #e0e0e0;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--neon-green);
            color: var(--bg-primary);
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(57, 255, 20, 0.5);
        }
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.8);
        }

        /* --- Content Sections --- */
        section {
            padding: 80px 0;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 40px;
            color: var(--neon-pink);
        }

        /* Features Section */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .feature-card {
            background-color: var(--bg-card);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #333;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .feature-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(0, 255, 255, 0.2);
        }

        .feature-card .icon {
            font-size: 3rem;
            color: var(--neon-cyan);
            margin-bottom: 20px;
        }

        /* About Section */
        .about-content {
            display: flex;
            align-items: center;
            gap: 40px;
        }
        .about-content img {
            max-width: 400px;
            border-radius: 10px;
            border: 3px solid var(--neon-pink);
        }

        /* Contact Section */
        .contact-form {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .contact-form input, .contact-form textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-secondary);
            border: 1px solid var(--text-secondary);
            border-radius: 5px;
            color: var(--text-primary);
            font-family: 'Poppins', sans-serif;
        }
        .contact-form input:focus, .contact-form textarea:focus {
            outline: none;
            border-color: var(--neon-cyan);
        }
        .contact-form button {
            background-color: var(--neon-pink);
            color: var(--bg-primary);
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            align-self: flex-end;
        }
        .contact-form button:hover {
            background-color: var(--neon-cyan);
        }

        /* Footer */
        footer {
            background-color: var(--bg-secondary);
            color: var(--text-secondary);
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #333;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .login-form { flex-direction: column; gap: 5px; }
            .hero-content h1 { font-size: 2.5rem; }
            .about-content { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- ========================================= -->
    <!--                  HEADER                  -->
    <!-- ========================================= -->
    <header>
        <nav class="container">
            <a href="#home" class="logo">
                <i class="fas fa-dove"></i> Sound to Species
            </a>
            <ul class="nav-links">
                <!-- THE href ATTRIBUTE POINTS TO THE SECTION ID -->
                <li><a href="#home">Home</a></li>
                <li><a href="#features">Features</a></li>
                <li><a href="#about">About Us</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
            <div class="login-section">
                <a href="{% url 'login' %}"><button id="login-toggle-btn">Login</button></a>
            </div>
        </nav>
    </header>
